<!doctype html>
<html
  lang="{{ site.Language.Locale }}"
  dir="{{ or site.Language.Direction `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="bg-page">
    <div>
      <header
        class="absolute inset-x-0 top-0 z-40 h-16 min-[1145px]:h-[76px] w-full border-b border-black/[0.08] bg-surface dark:border-white/10"
      >
        {{ partial "header.html" . }}
      </header>
    </div>
    <div class="z-20">
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    <div>
      <footer
        class="grid grid-cols-6 md:grid-cols-12 page-container relative lg:gap-10 gap-6 pt-14 lg:pt-20 pb-14 lg:pb-20"
      >
        {{ partial "footer.html" . }}
      </footer>
    </div>
  </body>
</html>
