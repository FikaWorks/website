{{- /*
  What we deliver: a checklist on a tinted band (no cards).
  @context page
*/}}
{{- with .Params.delivers }}
  <section class="py-16 lg:py-24 bg-fika-offWhite dark:bg-fika-dark-surface dark:text-white">
    <div class="grid grid-cols-6 md:grid-cols-12 page-container gap-6 lg:gap-10">
      <div class="col-span-full lg:col-start-1 lg:col-end-5">
        <h2 class="text-3xl font-medium lg:text-heading">What we deliver</h2>
        <p class="mt-4 text-base font-normal lg:text-lg text-gray-700 dark:text-gray-300">Scoped with you up front, owned by a named senior member of the cooperative.</p>
      </div>
      <ul class="col-span-full lg:col-start-5 lg:col-end-13 grid grid-cols-1 md:grid-cols-2 gap-x-10">
        {{- range . }}
          <li class="flex items-start gap-4 border-t border-gray-300 dark:border-white/15 py-5">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" class="mt-1 h-5 w-5 shrink-0 text-fika-purple dark:text-fika-light-purple"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="text-base lg:text-lg font-normal text-gray-900 dark:text-gray-100">{{ .text }}</span>
          </li>
        {{- end }}
      </ul>
    </div>
  </section>
{{- end }}
