{{- /* One service card in a stage. @context dict: service, stage, bg, arrow */}}
{{- $v := .service }}
<a
  href="{{ $v.url }}"
  class="group flex h-full flex-col justify-between p-6 lg:p-8 transition-colors duration-200 {{ if $v.highlight }}{{ index .bg .stage.color }} dark:bg-fika-soft-yellow-dark{{ else }}bg-fika-dust dark:bg-fika-dark-elevated dark:border dark:border-white/5 hover:bg-fika-ash/40 dark:hover:bg-white/10{{ end }}"
>
  <div>
    <h3 class="text-xl font-medium lg:text-2xl">
      {{ $v.title }}
      {{- if $v.highlight }}
        <span class="ml-2 align-middle rounded-full bg-black px-2.5 py-0.5 text-xs font-medium text-white">Highlighted</span>
      {{- end }}
    </h3>
    <p class="mt-3 text-base lg:text-lg font-normal italic text-gray-700 dark:text-gray-300">“{{ $v.problem }}”</p>
  </div>
  <div class="mt-6">
    <p class="text-sm font-medium text-gray-600 dark:text-gray-300">{{ $v.shape }}</p>
    <div class="mt-4 flex items-center gap-3 text-lg font-medium group-hover:text-fika-purple dark:group-hover:text-gray-300">{{ .arrow | safeHTML }}Learn more</div>
  </div>
</a>
