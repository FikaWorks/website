[module]
[module.hugoVersion]
extended = false
min = '0.147.0'
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

# Hugo 0.165+ no longer allows the Tailwind CLI by default; css.TailwindCSS needs it.
[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^tailwindcss$']
